name: Bootstrap Conditor and Dokimos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-conditor-dokimos.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fides
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build pinned Conditor and install pinned Dokimos CLI
        shell: bash
        run: |
          set -euo pipefail

          CONDITOR_COMMIT="2211e8c0e6849fe16e38d9c16ee5629a05d647d6"

          git clone --filter=blob:none --no-checkout https://github.com/kemiller2002/conditor.git /tmp/conditor-src
          git -C /tmp/conditor-src fetch --depth=1 origin "$CONDITOR_COMMIT"
          git -C /tmp/conditor-src checkout --detach FETCH_HEAD
          test "$(git -C /tmp/conditor-src rev-parse HEAD)" = "$CONDITOR_COMMIT"

          dotnet publish /tmp/conditor-src/src/Conditor.Cli/Conditor.Cli.fsproj             --configuration Release             --runtime linux-x64             --self-contained true             -p:PublishSingleFile=true             --output /tmp/conditor-publish
          test -x /tmp/conditor-publish/conditor

          mkdir -p /tmp/dokimos-bin
          curl -fL             -o /tmp/dokimos-linux-x64.tar.gz             https://github.com/kemiller2002/dokimos/releases/download/dokimos-v0.2.0/dokimos-linux-x64.tar.gz
          echo "bb61505cf8fa23bf6b0992019ca2e2805bda46eeba42eecde9497e15a060441a  /tmp/dokimos-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dokimos-linux-x64.tar.gz -C /tmp/dokimos-bin
          DOKIMOS="$(find /tmp/dokimos-bin -type f -name dokimos -print -quit)"
          test -n "$DOKIMOS"
          chmod +x "$DOKIMOS"
          echo "$(dirname "$DOKIMOS")" >> "$GITHUB_PATH"

      - name: Establish Registry authority and project manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .conditor/authority

          curl -fL             -o .conditor/authority/resolved-release-set.json             https://raw.githubusercontent.com/kemiller2002/echelon-registry/abb470a2bf3cf838e4f4324c3b5c4f6fdfcfea0a/channels/echelon-current/linux-x64.json
          echo "cd8d8d0482c5c4750f4bb31d28bc79e9597d3be4f6264955691e3aebd86cb6d2  .conditor/authority/resolved-release-set.json" | sha256sum -c -

          cat > conditor.json <<'JSON'
          {
            "schemaVersion": 1,
            "name": "fides",
            "registryAuthority": {
              "kind": "resolved-release-set",
              "path": ".conditor/authority/resolved-release-set.json",
              "sha256": "cd8d8d0482c5c4750f4bb31d28bc79e9597d3be4f6264955691e3aebd86cb6d2"
            },
            "components": [
              {
                "id": "dokimos",
                "version": "0.2.0",
                "required": true
              }
            ],
            "requirements": [],
            "execution": {
              "enabled": false
            }
          }
          JSON

      - name: Initialize and verify governed repository
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/dokimos-bin:$PATH"
          CONDITOR="/tmp/conditor-publish/conditor"

          "$CONDITOR" plan --manifest ./conditor.json --target .
          "$CONDITOR" init --manifest ./conditor.json --target .
          "$CONDITOR" verify --manifest ./conditor.json --target .
          "$CONDITOR" status --json --manifest ./conditor.json --target . > /tmp/conditor-status.json
          cat /tmp/conditor-status.json
          grep -Eq '"healthy"[[:space:]]*:[[:space:]]*true' /tmp/conditor-status.json

      - name: Commit governed state
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/workflows/bootstrap-conditor-dokimos.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Install Conditor and Dokimos [skip ci]"
          git push origin HEAD:main
