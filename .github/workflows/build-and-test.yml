name: Build and test

# Build the library and run its tests on every pull request and on main.
# The test step fails an empty or skipped run as well as a failing one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Fides.slnx -c Release
      - name: Test
        shell: bash
        run: |
          set -uo pipefail
          # GitHub runs bash with -e, so capture the status without letting a
          # failing test run end the step before its output is printed.
          status=0
          output=$(dotnet test Fides.slnx -c Release --no-build 2>&1) || status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if ! echo "$output" | grep -qE 'Passed:[[:space:]]*[1-9]'; then
            echo "::error::No test passed. An empty test run is not a pass."; exit 1
          fi
          if echo "$output" | grep -qE 'Skipped:[[:space:]]*[1-9]'; then
            echo "::error::Tests were skipped. A run that skips tests is not a pass."; exit 1
          fi
      - name: Pack
        run: dotnet pack src/Fides/Fides.fsproj -c Release --no-build -o dist
      - name: Package the AWS Lambda function (linux-arm64)
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Fides.Hosting.Aws/Fides.Hosting.Aws.fsproj -c Release -r linux-arm64 --self-contained -o dist/lambda
          test -x dist/lambda/bootstrap
          file dist/lambda/bootstrap | grep -q 'ARM aarch64'

  wasm:
    # The client must run where applications run it: inside the .NET
    # WebAssembly runtime, trimmed, in a JavaScript host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Run the client end to end in browser-wasm
        run: scripts/verify-wasm.sh

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the CloudFormation template
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.57.2
          cfn-lint infrastructure/aws/fides-exchange.template.json
