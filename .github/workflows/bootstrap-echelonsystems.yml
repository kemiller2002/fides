name: Install Echelon repository systems

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-echelonsystems.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fides
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Conditor and lifecycle binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/echelon-bin

          CONDITOR_COMMIT="2211e8c0e6849fe16e38d9c16ee5629a05d647d6"
          git clone --filter=blob:none --no-checkout https://github.com/kemiller2002/conditor.git /tmp/conditor-src
          git -C /tmp/conditor-src fetch --depth=1 origin "$CONDITOR_COMMIT"
          git -C /tmp/conditor-src checkout --detach FETCH_HEAD
          test "$(git -C /tmp/conditor-src rev-parse HEAD)" = "$CONDITOR_COMMIT"
          dotnet publish /tmp/conditor-src/src/Conditor.Cli/Conditor.Cli.fsproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true --output /tmp/conditor-publish
          test -x /tmp/conditor-publish/conditor

          curl -fLsS -o /tmp/praxis.tar.gz "https://github.com/kemiller2002/praxis/releases/download/v3.7.2/praxis-linux-x64.tar.gz"
          echo "cb44a7b9d3ddd696bc412b3e82ed0dee88b47751fa4b8ec7b933e1f60809b3e3  /tmp/praxis.tar.gz" | sha256sum -c -
          mkdir -p /tmp/praxis-dist
          tar -xzf /tmp/praxis.tar.gz -C /tmp/praxis-dist
          PRAXIS="$(find /tmp/praxis-dist -type f -name praxis -print -quit)"
          test -n "$PRAXIS"
          cp -a "$(dirname "$PRAXIS")/." /tmp/echelon-bin/
          test -f /tmp/echelon-bin/praxis-bin
          chmod +x /tmp/echelon-bin/praxis /tmp/echelon-bin/praxis-bin

          curl -fLsS -o /tmp/ordo.tar.gz "https://github.com/kemiller2002/ordo/releases/download/v1.4.2/ordo-linux-x64.tar.gz"
          echo "64ee9562aab3f1a8a789af39e0086d479d26150352824e53dd534a4fc8b79ca0  /tmp/ordo.tar.gz" | sha256sum -c -
          mkdir -p /tmp/ordo-dist
          tar -xzf /tmp/ordo.tar.gz -C /tmp/ordo-dist
          ORDO="$(find /tmp/ordo-dist -type f -name ordo -print -quit)"
          test -n "$ORDO"
          cp -a "$(dirname "$ORDO")/." /tmp/echelon-bin/
          chmod +x /tmp/echelon-bin/ordo
          if [ -f /tmp/echelon-bin/ordo-bin ]; then chmod +x /tmp/echelon-bin/ordo-bin; fi
          find /tmp/ordo-dist -maxdepth 2 -type f -printf 'Ordo asset: %P\n'

          curl -fLsS -o /tmp/echelon-bin/percepta-repo "https://github.com/kemiller2002/percepta/releases/download/percepta-repo-v0.1.0/percepta-repo-linux-x64"
          echo "e46113aa08c9d2a97dfb1f75ca65c986946e1601c5f2c5cdcc9e8c25841d6039  /tmp/echelon-bin/percepta-repo" | sha256sum -c -
          chmod +x /tmp/echelon-bin/percepta-repo

          curl -fLsS -o /tmp/dokimos.tar.gz "https://github.com/kemiller2002/dokimos/releases/download/dokimos-v0.2.0/dokimos-linux-x64.tar.gz"
          echo "bb61505cf8fa23bf6b0992019ca2e2805bda46eeba42eecde9497e15a060441a  /tmp/dokimos.tar.gz" | sha256sum -c -
          mkdir -p /tmp/dokimos-dist
          tar -xzf /tmp/dokimos.tar.gz -C /tmp/dokimos-dist
          DOKIMOS="$(find /tmp/dokimos-dist -type f -name dokimos -print -quit)"
          test -n "$DOKIMOS"
          chmod +x "$DOKIMOS"
          cp "$DOKIMOS" /tmp/echelon-bin/dokimos

          echo "/tmp/echelon-bin" >> "$GITHUB_PATH"

      - name: Pin complete Echelon repository environment
        shell: bash
        run: |
          set -euo pipefail
          echo "cd8d8d0482c5c4750f4bb31d28bc79e9597d3be4f6264955691e3aebd86cb6d2  .conditor/authority/resolved-release-set.json" | sha256sum -c -
          cat > conditor.json <<'JSON'
          {
            "schemaVersion": 1,
            "name": "fides",
            "registryAuthority": {
              "kind": "resolved-release-set",
              "path": ".conditor/authority/resolved-release-set.json",
              "sha256": "cd8d8d0482c5c4750f4bb31d28bc79e9597d3be4f6264955691e3aebd86cb6d2"
            },
            "components": [
              {"id": "praxis", "version": "3.7.2", "required": true},
              {"id": "ordo", "version": "1.4.2", "required": true},
              {"id": "percepta", "version": "0.1.0", "required": true},
              {"id": "dokimos", "version": "0.2.0", "required": true},
              {"id": "visual-engineering", "version": "1.0.1", "required": true},
              {"id": "communication-engineering", "version": "1.0.0", "required": true},
              {"id": "tutela", "version": "0.1.0", "required": true}
            ],
            "requirements": [],
            "execution": {"enabled": false}
          }
          JSON

      - name: Plan initialize and verify all Echelon systems
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/echelon-bin:$PATH"
          CONDITOR="/tmp/conditor-publish/conditor"
          "$CONDITOR" plan --manifest ./conditor.json --target .
          "$CONDITOR" init --manifest ./conditor.json --target .
          "$CONDITOR" verify --manifest ./conditor.json --target .
          "$CONDITOR" status --json --manifest ./conditor.json --target . > /tmp/conditor-status.json
          cat /tmp/conditor-status.json
          grep -Eq '"healthy"[[:space:]]*:[[:space:]]*true' /tmp/conditor-status.json

          echo 'ECHELON_MANAGED_WORKFLOW_SUMMARY_BEGIN'
          git status --short -- .github/workflows
          echo 'ECHELON_MANAGED_WORKFLOW_SUMMARY_END'
          for file in .github/workflows/*; do
            if [ -f "$file" ]; then
              echo "ECHELON_WORKFLOW_BEGIN::$file"
              cat "$file"
              echo "ECHELON_WORKFLOW_END::$file"
            fi
          done

      - name: Commit governed non-workflow state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .
          git reset -q -- .github/workflows
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Install full Echelon repository tooling through Conditor [skip ci]"
            git push origin HEAD:main
          fi
